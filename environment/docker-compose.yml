# Runs the PV service. Callers on tentacron-net address it as pysam-pv:8080;
# from the host: localhost:${HOST_PORT}.
#
#   docker compose -f environment/docker-compose.yml up -d --build
name: pysam-pv

services:
  api:
    build:
      context: ..
      dockerfile: environment/Dockerfile
    image: ${PV_SERVICE_IMAGE:-pysam-pv:local}
    environment:
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
    ports:
      - "${HOST_PORT:-8092}:8080"
    healthcheck:
      # The slim base image has no curl or wget.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    networks:
      default:
      tentacron-net:
        # `api` is registered by other repositories on this network too, so
        # it is never an address. pv-service is kept until every caller has
        # moved to pysam-pv.
        aliases: [pysam-pv, pv-service]
    restart: unless-stopped

# Declared with `name:` and no `external:` so the first stack up creates it;
# every repository joining tentacron-net declares it the same way.
networks:
  tentacron-net:
    name: tentacron-net
